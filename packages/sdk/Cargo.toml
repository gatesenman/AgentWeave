[package]
name = "agentweave-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for building custom AgentWeave vendor adapters"
license = "MIT"
readme = "README.md"

[dependencies]
agentweave-core = { path = "../../crates/agentweave-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
